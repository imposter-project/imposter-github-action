name: 'Start Imposter Mocks'
description: 'Starts the Imposter mock server in the background and waits for it to be healthy'

inputs:
  config-dir:
    description: 'Path to the directory containing the Imposter configuration files'
    required: false
    default: './mocks'
  port:
    description: 'Port number for the Imposter server'
    required: false
    default: '8080'
  version:
    description: 'Version of the Imposter mock engine to use'
    required: false
    default: ''
  engine-type:
    description: 'Type of mock engine to use (jvm or docker)'
    required: false
    default: 'docker'
  recursive-config-scan:
    description: 'Whether to recursively scan the config directory for mock configurations'
    required: false
    default: 'false'
  mock-id-file:
    description: 'Optional path to a file where the started mock ID will be written, for later use with the stop-mocks mock-id-file input.'
    required: false
    default: ''
  auto-restart:
    description: 'Deprecated and ignored. The mock now runs detached, which is incompatible with auto-restart.'
    required: false
    deprecationMessage: "The 'auto-restart' input is deprecated and no longer used; the mock now runs detached, which is incompatible with auto-restart."
  max-attempts:
    description: 'Deprecated and ignored. The CLI now waits for the healthcheck before returning (--detach=healthy).'
    required: false
    deprecationMessage: "The 'max-attempts' input is deprecated and no longer used; the CLI now waits for the healthcheck before returning."
  retry-interval:
    description: 'Deprecated and ignored. The CLI now waits for the healthcheck before returning (--detach=healthy).'
    required: false
    deprecationMessage: "The 'retry-interval' input is deprecated and no longer used; the CLI now waits for the healthcheck before returning."

outputs:
  base-url:
    description: 'Base URL of the mock server'
    value: http://localhost:${{ inputs.port }}

runs:
  using: "composite"
  steps:
    - name: Warn on deprecated inputs
      if: ${{ inputs.auto-restart != '' || inputs.max-attempts != '' || inputs.retry-interval != '' }}
      shell: bash
      run: echo "::warning title=Deprecated input::The 'auto-restart', 'max-attempts' and 'retry-interval' inputs of start-mocks are deprecated and no longer used; the mock now starts detached and the CLI waits for the healthcheck before returning."

    - name: Pull Imposter engine
      shell: bash
      env:
        ENGINE_TYPE: ${{ inputs.engine-type }}
        VERSION: ${{ inputs.version }}
        CONFIG_DIR: ${{ inputs.config-dir }}
      run: |
        echo "Pulling $ENGINE_TYPE engine"
        if [ -n "$VERSION" ]; then
          imposter engine pull --engine-type "$ENGINE_TYPE" --version "$VERSION" --config "$CONFIG_DIR/.imposter.yaml"
        else
          imposter engine pull --engine-type "$ENGINE_TYPE" --config "$CONFIG_DIR/.imposter.yaml"
        fi

    - name: Start Imposter server
      shell: bash
      env:
        PORT: ${{ inputs.port }}
        ENGINE_TYPE: ${{ inputs.engine-type }}
        VERSION: ${{ inputs.version }}
        CONFIG_DIR: ${{ inputs.config-dir }}
        RECURSIVE_CONFIG_SCAN: ${{ inputs.recursive-config-scan }}
        MOCK_ID_FILE: ${{ inputs.mock-id-file }}
      run: |
        # Start the mock detached; --detach=healthy returns once the healthcheck passes.
        args=(up --port "$PORT" --engine-type "$ENGINE_TYPE" --detach=healthy --recursive-config-scan="$RECURSIVE_CONFIG_SCAN")
        if [ -n "$VERSION" ]; then
          args+=(--version "$VERSION")
        fi
        if [ -n "$MOCK_ID_FILE" ]; then
          args+=(--id-file "$MOCK_ID_FILE")
        fi
        args+=(--config "$CONFIG_DIR/.imposter.yaml" "$CONFIG_DIR")

        imposter "${args[@]}"
        echo "Imposter server is ready at http://localhost:$PORT"
